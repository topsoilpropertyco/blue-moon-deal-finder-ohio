# The DRILL: Data Resolution through Incremental List Liquidation.
# Every property runs down these stages in order. Only unresolved records move on.
# No record is abandoned until every stage has been tried.
#
# Contact levels (per property):
#   1 = No owner data   2 = Possible owner   3 = Confirmed owner (we talked, they confirmed)
# Level 3 hands the property to the CRM. Records alone never confirm an owner.
#
# goal:       identify (get an owner name) | unmask (find the person behind an entity)
#             | reach (find a phone, email or social account) | validate (test it with the owner)
# automation: auto (the app does it) | assisted (the app opens the right pages, you record what you find)
#             | manual (you do it outside the app and check it off)
# cost:       free | credit (Crexi owner-contact credit) | paid (off until you turn it on)
#             | plan (your Claude plan through Claude Code; no per-call bill)
# background: true = runs as its own job from the Run screen. It never holds up the hands-on stages: it only
#             becomes an owner's next step when nothing else is left to try.
# applies_to: owner types (individual, trust, estate, small_llc, corporation, portfolio,
#             institutional, government, nonprofit, unknown) or [all]
# hit_rate:   starting guess; replaced by your real results as you work

levels:
  1: {name: No owner data, help: No owner name on record yet.}
  2: {name: Possible owner, help: We have owner data from records but have not talked to them.}
  3: {name: Confirmed owner, help: We reached them and they confirmed they own it. Hand off to the CRM.}

stages:
  - key: records_baseline
    name: Records baseline
    goal: identify
    automation: auto
    cost: free
    applies_to: [all]
    sources: [crexi_export, ohio_statewide_parcels, indiana_sales_disclosure]
    method: Owner name and mailing address from the Crexi export.
    hit_rate: 0.95
    learn: Separates records with an owner name from the ones invisible to commodity data.

  - key: portfolio_match
    name: Portfolio match
    goal: unmask
    automation: auto
    cost: free
    applies_to: [all]
    sources: [internal_portfolio, ohio_statewide_parcels, indiana_sales_disclosure]
    method: Groups properties that share an owner name or mailing address. A contact or confirmation on one property carries to its siblings.
    hit_rate: 0.10
    learn: One owner often holds several properties under different LLCs at the same mailing address.

  - key: county_auditor
    name: County auditor
    goal: identify
    automation: assisted
    cost: free
    applies_to: [all]
    sources: [county_auditor, county_gis]
    method: Open the parcel page by parcel number. Confirm the current owner, the tax mailing address and the last transfer date.
    hit_rate: 0.85
    learn: Tax records give the legal owner of record and catch recent sales Crexi missed.

  - key: ai_research
    name: AI web research
    goal: reach
    automation: auto
    background: true            # its own job (Run screen, AI research); never blocks the stages you work by hand
    cost: plan                  # your Claude plan through Claude Code; no per-call bill
    applies_to: [individual, trust, estate, small_llc, corporation, portfolio, nonprofit, unknown]
    sources: [ai_web_research]
    method: Claude searches the web for the owner's business filing, officers and statutory agent, company website, public business phone and email, and business social pages, with the link where it saw each. It never uses people-search sites. Everything it finds stays "not tested yet" until you reach out.
    hit_rate: 0.30
    learn: One search per owner covers every property they own. Public filings and business pages often show a phone or email no other free source has.

  - key: rental_registration
    name: Rental registration
    goal: reach
    automation: assisted
    cost: free
    applies_to: [all]
    asset_classes: [apartments, mobile_home_park]
    states: [OH]
    sources: [rental_registration]
    method: Ohio counties with 200,000+ people keep a rental registration (ORC 5323.02) with an owner or agent phone. Franklin and Montgomery show it online with the phone; Hamilton and Delaware online without the phone; Butler and Warren by public-records request. Some cities (Springfield, Dayton, Columbus) keep their own registry; ask them for the owner contact on file.
    hit_rate: 0.35
    learn: Often the only free source of an owner's phone number.

  - key: entity_unmask
    name: LLC and trust lookup
    goal: unmask
    automation: assisted
    cost: free
    applies_to: [small_llc, corporation, portfolio, trust, estate, institutional, unknown]
    sources: [ohio_sos, indiana_inbiz, opencorporates, sec_edgar, ohio_ucc, indiana_sales_disclosure, ohio_mh_park_licenses, ohio_campground_licenses, indiana_mhc_roster, indiana_campground_roster, ohfa_compliance, bbb_profiles]
    method: Search the entity at the Secretary of State. Record the statutory agent, organizer or incorporator, and any officers named in filings.
    hit_rate: 0.15
    learn: Separates owners hidden behind an entity from owners who are truly unreachable.

  - key: recorder_documents
    name: Recorder documents
    goal: unmask
    automation: assisted
    cost: free
    applies_to: [small_llc, corporation, portfolio, trust, estate, unknown]
    sources: [county_recorder, ohio_ucc]
    method: Open the deed and mortgage at the county recorder. The person who signed for the LLC or trust is usually the decision-maker.
    hit_rate: 0.30
    learn: Signatures on deeds and mortgages name the real people behind entities.

  - key: property_contacts
    name: On-site and manager contacts
    goal: reach
    automation: assisted
    cost: free
    applies_to: [all]
    asset_classes: [apartments, self_storage, campground_rv, mobile_home_park]
    sources: [google_maps_listing, apartment_listings, hud_multifamily, hud_lihtc, epa_water_systems, hifld_mobile_home_parks, mhvillage_directory, ohio_self_storage_assn, ohio_real_estate_license, indiana_real_estate_license, ohio_epa_edocs, state_licenses]
    method: Find the leasing office, manager or park office listing and its phone. Ask them to pass a message to the owner or share the owner's contact.
    hit_rate: 0.30
    learn: Operating properties have a front desk; managers know the owner.

  - key: occupant_lookup
    name: Occupant and operator lookup
    goal: reach
    automation: assisted
    cost: free
    applies_to: [all]
    asset_classes: [warehouse, outdoor_storage]
    sources: [google_maps_listing, fmcsa_carriers, epa_echo, ohio_epa_edocs]
    method: Find the business that uses the building or yard (trucking company, regulated facility, tenant). Call them and ask who the landlord is, or ask them to pass a message on.
    hit_rate: 0.25
    learn: Occupied industrial properties have a tenant who knows the landlord.

  - key: web_footprint
    name: Web and social search
    goal: reach
    automation: assisted
    cost: free
    applies_to: [all]
    sources: [google_search, linkedin, facebook, free_people_search, bbb_profiles]
    method: Search the best-guess person with the city. Check LinkedIn, Facebook and business websites. Free people-search sites can show phones and relatives; use them by hand only.
    hit_rate: 0.20
    learn: Younger owners and active landlords are more findable here.

  - key: crexi_credit
    name: Crexi owner-contact credit
    goal: reach
    automation: manual
    cost: credit
    applies_to: [all]
    sources: [crexi_contact]
    method: Use one of the 500 monthly Crexi credits on this owner. The credit plan picks the highest-ranked owners the free stages could not reach. Credits do not roll over, so the plan spends them all each month.
    hit_rate: 0.69
    learn: Paid-in-advance data; best spent where free sources failed.

  - key: court_records
    name: Court and probate records
    goal: unmask
    automation: assisted
    cost: free
    applies_to: [all]
    sources: [probate_court, clerk_of_courts, obituaries, county_delinquent_tax, sheriff_sales, courtlistener]
    method: Search probate (estates, guardianships), civil cases (evictions name the owner and its attorney), liens and foreclosures tied to the owner or property.
    hit_rate: 0.25
    learn: Properties in legal limbo have paper trails, and change how we approach the owner.

  - key: letters
    name: Letters
    goal: reach
    automation: manual
    cost: free
    applies_to: [all]
    sources: [mail, ohio_voter_file]
    method: Mail a letter to the owner's mailing address, the statutory agent's address, and "Owner" at the property. Ask them to call or text.
    hit_rate: 0.05
    learn: Always available; slow but reaches owners who avoid phones.

  - key: neighbor_network
    name: Neighbors and local network
    goal: reach
    automation: manual
    cost: free
    applies_to: [all]
    sources: [neighbors, county_gis, ohio_statewide_parcels, local_brokers]
    method: Ask adjacent owners, local brokers, property managers and contractors who own or manage the property.
    hit_rate: 0.20
    learn: High-touch, low-tech. Works on high-value targets.

  - key: paid_skip_trace
    name: Paid skip trace
    goal: reach
    automation: manual
    cost: paid
    enabled: false              # turn on only after you decide to pay for a vendor
    applies_to: [all]
    sources: [skip_trace_vendors]
    method: Run the remaining unresolved owners through a paid skip-trace vendor (for example BatchSkipTracing, PropStream, REISkip). Off by default.
    hit_rate: 0.20
    learn: Vendor diversity matters; no single database has everything.

  - key: deep_research
    name: Deep research
    goal: reach
    automation: manual
    cost: free
    applies_to: [all]
    sources: [all_sources, sec_edgar, obituaries]
    method: One person exhausts every angle on this record. What remains after this is truly unreachable, and we know why.
    hit_rate: 0.50
    learn: Final filter.

# Testing contact info is not a stage in the list: whenever a property has
# untested contact info, its next step is to reach out on it.
# Tuning (starting values; change freely).
hit_rate_prior_strength: 10     # how many real tries it takes before your own hit rates outweigh the starting guesses
advice_min_tries: 10            # tries on a stage before the app gives advice about it (and before it can move it)
# Let your results reorder the free hands-on stages for each owner type (a stage that keeps working for
# small LLCs moves ahead of one that keeps failing). A stage only trades places with another stage of the same
# goal, and only after advice_min_tries results. Automatic, credit, paid and manual stages never move.
# The credit plan also ranks owners by score x the Crexi credit's hit rate for their owner type.
learn_order: true

validate:
  name: Reach out and confirm
  tries_before_moving_on: 2     # unanswered tries on a contact before the drill also moves on to the next stage
  channels: [phone, text, email, social, vm, mail]
  outcomes:
    no_answer: {label: "No answer", effect: none}
    left_message: {label: "Left a message", effect: none}
    replied_unconfirmed: {label: "Replied, not confirmed yet", effect: none}
    wrong_person: {label: "Wrong person or number", effect: mark_wrong}
    bounced: {label: "Bounced or disconnected", effect: mark_wrong}
    reached_confirmed: {label: "Talked to owner, confirmed", effect: confirm}
    do_not_contact: {label: "Asked us not to contact", effect: dnc}
    # Reached a manager or relative who will pass the message on? Log "Left a message": the number stays usable.

# AI web research (the ai_research stage above). Claude Code on this computer, on your Claude plan: one call per
# owner, buy-box owners first. Run it from the Run screen ("AI research (owners)") or
# `uv run run.py research --limit 5`. Runs that cover more than safety.confirm_over_properties properties
# (config.yaml) wait for your OK. Everything it finds is saved "not tested yet", with the link where it was seen.
ai_research:
  backend: claude_cli            # claude_cli = your Claude plan | mock = offline test answers
  model: sonnet
  timeout_seconds: 420           # one owner's search may take a few minutes
  max_turns: 20                  # searches and page reads Claude may make for one owner
  pause_seconds: 5               # gap between owners, to be gentle on plan limits
  max_calls_per_run: 100         # owners asked per run; run it again for the rest
  max_consecutive_errors: 3      # stop a run after this many owners in a row fail
  min_confidence: medium         # findings below this are kept only as leads (not added as contacts)
  scope: buybox                  # buybox = owners of buy-box properties | all = every owner
  refresh_after_days: 180        # an owner's saved answer is reused this long, then asked again
  est_seconds_per_owner: 120     # for the time shown in the estimate
  max_people: 6                  # at most this many people and contacts are taken from one answer
  max_contacts: 8
  # Never used, and every finding that cites one is dropped: people-search, background-check and data-broker
  # sites, plus Crexi. A site's subdomains are blocked too (www.spokeo.com is spokeo.com).
  blocked_domains: [
    whitepages.com, 411.com, anywho.com, addresses.com, spokeo.com, truepeoplesearch.com, truepeoplesearch.net,
    fastpeoplesearch.com, fastbackgroundcheck.com, beenverified.com, peoplelooker.com, peoplesmart.com,
    ownerly.com, numberguru.com, intelius.com, peopleconnect.us, instantcheckmate.com, truthfinder.com,
    ussearch.com, zabasearch.com, peoplefinders.com, peoplefinder.com, publicrecordsnow.com, radaris.com,
    mylife.com, usphonebook.com, unitedstatesphonebook.com, thatsthem.com, nuwber.com, clustrmaps.com,
    searchpeoplefree.com, peoplesearchnow.com, cyberbackgroundchecks.com, advancedbackgroundchecks.com,
    smartbackgroundchecks.com, peoplebackgroundcheck.com, familytreenow.com, peekyou.com, pipl.com,
    checkpeople.com, infotracer.com, privateeye.com, privaterecords.net, publicdatacheck.com,
    publicdatausa.com, usa-people-search.com, peoplebyname.com, freepeopledirectory.com, searchquarry.com,
    spyfly.com, veripages.com, unmask.com, socialcatfish.com, searchbug.com, voterrecords.com, voteref.com,
    rehold.com, homemetry.com, neighbor.report, neighborwho.com, idcrawl.com, peoplewhiz.com, cocofinder.com,
    golookup.com, information.com, spydialer.com, sync.me, callersmart.com, numlookup.com,
    reversephonelookup.com, truecaller.com, locatefamily.com, dataveria.com, publicinfoservices.com,
    recordsfinder.com, staterecords.org, arrests.org, arrestfacts.com, backgroundcheck.run, sortedbyname.com,
    peoplesearchexpert.com, quickpeopletrace.com, propeoplesearch.com, verecor.com, vericora.com,
    veriforia.com, persopo.com, officialusa.com, 411locate.com, 411.info, addresssearch.com,
    backgroundalert.com, checkthem.com, findpeoplesearch.com, gladiknow.com, kwold.com, locatepeople.org,
    newenglandfacts.com, publicrecords.directory, revealname.com, truthrecord.org, usinfosearch.com,
    searchusapeople.com, spytox.com, idtrue.com, propertyrecs.com, webmii.com, blockshopper.com, zoominfo.com,
    rocketreach.co, contactout.com, signalhire.com, lusha.com, apollo.io, seamless.ai, peopledatalabs.com,
    crexi.com]
  # Companies paid to be the statutory agent for many LLCs. Their phone and email reach the agent company, not
  # the owner, so they are never saved as contacts (the agent is still noted, as an agent).
  registered_agent_services: [
    CT Corporation, C T Corporation System, Corporation Service Company, CSC, Northwest Registered Agent,
    Registered Agents Inc, Registered Agent Solutions, InCorp Services, Cogency Global,
    National Registered Agents, Harbor Compliance, LegalZoom, ZenBusiness, Statutory Agent Corp,
    United States Corporation Agents, Incfile, Bizfilings, Wolters Kluwer, Swyft Filings, Rocket Corporate Services,
    Business Filings Incorporated, URS Agents, Capitol Corporate Services]
