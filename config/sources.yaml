# Free (and a few paid, switched-off) data sources the DRILL uses.
# priority: 1 = try first. cost: free | credit | paid.
# kind: link (the app builds a link you open) | county (link comes from the county table below)
#       | auto (the app does it itself) | manual (outside the app)
#
# Link templates can use these placeholders. Values are URL-encoded where the name ends in _q.
#   {apn} {apn_q} {apn_digits} {address} {address_q} {city} {city_q} {state} {zip} {county}
#   {owner} {owner_q} {person} {person_q} {person_or_owner_q} {lat} {lng} {crexi_url} {full_address_q}
#
# The county table is filled from research (docs/DATA_SOURCES.md). A county link with no
# deep-link template falls back to the county's search page.

sources:
  crexi_export:
    name: Crexi export
    kind: auto
    cost: free
    priority: 1
    finds: Owner name, mailing address, sale and loan history.
  internal_portfolio:
    name: Your own list (portfolio match)
    kind: auto
    cost: free
    priority: 1
    finds: Other properties with the same owner name or mailing address.
  ai_web_research:
    name: AI web research (your Claude plan)
    kind: auto
    cost: free
    priority: 2
    finds: The owner's business filing, officers and statutory agent, website, public business phone and email, and business social pages, each with the link where it was seen. Never people-search sites. Run it from the Run screen (AI research).
  county_auditor:
    name: County auditor parcel page
    kind: county
    cost: free
    priority: 1
    finds: Current owner of record, tax mailing address, last transfer.
  rental_registration:
    name: County rental registration (Ohio ORC 5323.02)
    kind: county
    cost: free
    priority: 1
    finds: Owner or agent name, address and phone for residential rentals.
  ohio_sos:
    name: Ohio Secretary of State business search
    states: [OH]
    kind: link
    cost: free
    priority: 2
    url: https://businesssearch.ohiosos.gov/
    template: https://businesssearch.ohiosos.gov/
    finds: Statutory agent, incorporator or organizer, filing history.
    how: Search the entity name exactly as in "Owner on record". Open the filings for signer names.
  indiana_inbiz:
    name: Indiana INBiz business search
    kind: link
    cost: free
    priority: 2
    url: https://bsd.sos.in.gov/publicbusinesssearch
    template: https://bsd.sos.in.gov/publicbusinesssearch
    states: [IN]
    finds: Registered agent and principals for Indiana entities.
  opencorporates:
    name: OpenCorporates
    kind: link
    cost: free
    priority: 3
    template: https://opencorporates.com/companies?q={owner_q}&jurisdiction_code=us_{state_lower}
    finds: Officers, agents and related companies across states.
  county_recorder:
    name: County recorder (deeds and mortgages)
    kind: county
    cost: free
    priority: 2
    finds: Who signed the deed or mortgage for an LLC or trust.
  google_maps_listing:
    name: Google Maps listing
    kind: link
    cost: free
    priority: 2
    template: https://www.google.com/maps/search/?api=1&query={full_address_q}
    finds: Leasing office or business phone at the property.
  apartment_listings:
    name: Apartment listing sites
    kind: link
    cost: free
    priority: 3
    template: https://www.google.com/search?q={full_address_q}+apartments+leasing+office
    finds: Property manager and leasing phone.
  state_licenses:
    name: State operating licenses
    kind: link
    cost: free
    priority: 2
    template: https://www.google.com/search?q={owner_q}+{city_q}+Ohio+license
    finds: Licensed operator name and contact (campgrounds, mobile home parks).
  google_search:
    name: Google search
    kind: link
    cost: free
    priority: 2
    template: https://www.google.com/search?q=%22{person_or_owner_q}%22+{city_q}+{state}
    finds: Business sites, news, obituaries, related companies.
  linkedin:
    name: LinkedIn
    kind: link
    cost: free
    priority: 3
    template: https://www.linkedin.com/search/results/people/?keywords={person_q}
    finds: Current job and messaging for the person.
  facebook:
    name: Facebook
    kind: link
    cost: free
    priority: 3
    template: https://www.facebook.com/search/people/?q={person_q}
    finds: Profile and Messenger for the person.
  free_people_search:
    name: Free people-search sites (by hand)
    kind: link
    cost: free
    priority: 3
    template: https://www.truepeoplesearch.com/results?name={person_q}&citystatezip={city_q}%2C%20{state}
    finds: Phones, emails, relatives. Use by hand only; do not automate.
  crexi_contact:
    name: Crexi owner-contact credit
    kind: link
    cost: credit
    priority: 4
    template: "{crexi_url}"
    finds: Owner phone and email from Crexi.
  probate_court:
    name: County probate court
    kind: county
    cost: free
    priority: 4
    finds: Estates, heirs, executors.
  clerk_of_courts:
    name: County clerk of courts
    kind: county
    cost: free
    priority: 4
    finds: Evictions (owner and attorney), liens, foreclosures.
  mail:
    name: Letters
    kind: manual
    cost: free
    priority: 5
    finds: Owners who avoid phones.
  neighbors:
    name: Neighbors
    kind: link
    cost: free
    priority: 5
    template: https://www.google.com/maps/search/?api=1&query={lat},{lng}
    finds: Adjacent owners who know the owner.
  local_brokers:
    name: Local brokers and managers
    kind: manual
    cost: free
    priority: 5
    finds: Who owns or manages the property.
  skip_trace_vendors:
    name: Paid skip trace (off)
    kind: manual
    cost: paid
    priority: 9
    finds: Phones and emails from a paid vendor. Off until you decide to pay.
  all_sources:
    name: Every source
    kind: manual
    cost: free
    priority: 9
    finds: Whatever is left.
  street_view:
    name: Street View
    kind: link
    cost: free
    priority: 9
    template: https://www.google.com/maps/@?api=1&map_action=pano&viewpoint={lat},{lng}
    finds: A look at the property.

  # --- Added 2026-10-21 from the data-source research (see docs/DATA_SOURCES.md). ---------------
  # `asset_classes` (read by the app) hides a source's links on properties of other asset classes.
  # `drill_stages` is a note on which DRILL stages a source could help; only the `sources:` lists in
  # config/drill.yaml wire a source into a stage. `county_slot` (read by the app) points a county source
  # at a slot in the county table below. `api` is the machine-readable endpoint for a later automatic step.
  county_gis:
    name: County parcel map (GIS)
    kind: county
    cost: free
    priority: 2
    finds: Parcel lines, acreage and the neighbors around the property; some maps link to the auditor page.
    how: Find the parcel on the map, then click the parcels next to it for neighbor owners.
    drill_stages: [county_auditor, neighbor_network]
  county_delinquent_tax:
    name: County delinquent-tax list
    kind: county
    county_slot: delinquent_tax
    cost: free
    priority: 3
    finds: Owners behind on property taxes (a motivated-seller sign) and how much they owe.
    how: Look for the parcel or the owner on the list. Most auditor parcel pages also show delinquent taxes.
    drill_stages: [court_records, letters]
  sheriff_sales:
    name: Sheriff's sale auctions (Ohio RealForeclose)
    kind: county
    county_slot: sheriff_sale
    cost: free
    priority: 3
    finds: Foreclosure sales with the case number, parcel, appraised value and the lender suing.
    how: Search the auction calendar for the address or parcel. The case number leads to the clerk of courts file. Every Ohio county here has a site at {county}.sheriffsaleauction.ohio.gov.
    drill_stages: [court_records]
  ohio_statewide_parcels:
    name: Ohio statewide parcel map (OGRIP)
    kind: link
    cost: free
    priority: 1
    states: [OH]
    url: "https://geohio.maps.arcgis.com/apps/instant/lookup/index.html?appid=8bfcff44b9734007b4c8853a6a0b9e04"
    api: "https://services2.arcgis.com/MlJ0G8iWUyC7jAmu/arcgis/rest/services/OhioStatewidePacels_full_view/FeatureServer/0"
    finds: For every Ohio parcel, the owner's mailing address, the land-use code (401-403 apartments, 415 mobile home park, 416 campground, 480 warehouse, 300/400 vacant land) and a link to the county auditor page. No owner name.
    how: Click the property. A mailing address that differs from the property address means an absentee owner. The same mailing address on several parcels means one owner (a portfolio). The data is mostly from 2023, so confirm the owner on the auditor page.
    drill_stages: [records_baseline, portfolio_match, neighbor_network, letters]
  hud_multifamily:
    name: HUD-assisted apartments (manager phone and email)
    kind: link
    cost: free
    priority: 1
    url: "https://www.hud.gov/hud-partners/multifamily-assist-section8-database"
    template: "https://services.arcgis.com/VTyQ9soqVukalItT/ArcGIS/rest/services/MULTIFAMILY_PROPERTIES_ASSISTED/FeatureServer/0/query?where=STD_ZIP5%3D%27{zip}%27&outFields=PROPERTY_NAME_TEXT,STD_ADDR,STD_CITY,TOTAL_UNIT_COUNT,PROPERTY_ON_SITE_PHONE_NUMBER,MGMT_AGENT_ORG_NAME,MGMT_CONTACT_FULL_NAME,MGMT_CONTACT_MAIN_PHN_NBR,MGMT_CONTACT_EMAIL_TEXT&returnGeometry=false&f=html"
    api: "https://services.arcgis.com/VTyQ9soqVukalItT/ArcGIS/rest/services/MULTIFAMILY_PROPERTIES_ASSISTED/FeatureServer/0"
    finds: For HUD-assisted or HUD-insured apartments, the management company, contact name, phone and email, plus the on-site phone.
    how: The link lists every HUD-assisted property in the ZIP code. Look for this address. HUD's Section 8 database (Excel, updated monthly, link in docs/DATA_SOURCES.md) also lists the owner company with its phone and email.
    asset_classes: [apartments]
    drill_stages: [property_contacts, entity_unmask]
  hud_lihtc:
    name: HUD tax-credit (LIHTC) apartments
    kind: link
    cost: free
    priority: 2
    url: "https://www.huduser.gov/portal/datasets/lihtc/property.html"
    template: "https://egis.hud.gov/arcgis/rest/services/gotit/LIHTCProperties/MapServer/0/query?where=STD_ZIP5%3D%27{zip}%27&outFields=PROJECT,STD_ADDR,STD_CITY,N_UNITS,CONTACT,COMPANY,CO_TEL&returnGeometry=false&f=html"
    finds: Tax-credit apartment projects with the owner contact person, company and phone (projects through about 2014).
    how: The link lists every tax-credit project in the ZIP code. Look for this address. The contact is often the original developer.
    asset_classes: [apartments]
    drill_stages: [property_contacts, entity_unmask]
  epa_water_systems:
    name: EPA public water systems (operator phone and email)
    kind: link
    cost: free
    priority: 1
    url: "https://data.epa.gov/efservice/WATER_SYSTEM/PRIMACY_AGENCY_CODE/OH/PWS_NAME/CONTAINING/CAMPGROUND/PWS_ACTIVITY_CODE/A/JSON"
    template: "https://data.epa.gov/efservice/WATER_SYSTEM/PRIMACY_AGENCY_CODE/{state}/CITY_NAME/{city}/PWS_ACTIVITY_CODE/A/JSON"
    api: "https://data.epa.gov/efservice/WATER_SYSTEM/PRIMACY_AGENCY_CODE/{state}/PWS_ACTIVITY_CODE/A/JSON"
    finds: Campgrounds, mobile home parks and rural properties with their own well are listed with the operator's name, phone, email and mailing address.
    how: The link lists the active water systems in the city. Look for the park or campground name (pws_name) and read admin_name, phone_number and email_addr. The city is the system's mailing city, so also try the next town over.
    asset_classes: [campground_rv, mobile_home_park, apartments]
    drill_stages: [property_contacts, entity_unmask]
  hifld_mobile_home_parks:
    name: Mobile home and RV park list (HIFLD)
    kind: link
    cost: free
    priority: 2
    url: "https://services.arcgis.com/0ZRg6WRC7mxSLyKX/ArcGIS/rest/services/Mobile_Home_Parks/FeatureServer"
    template: "https://services.arcgis.com/0ZRg6WRC7mxSLyKX/ArcGIS/rest/services/Mobile_Home_Parks/FeatureServer/0/query?where=STATE%3D%27{state}%27+AND+CITY%3D%27{city_q}%27&outFields=NAME,ADDRESS,CITY,TELEPHONE,TYPE&returnGeometry=false&f=html"
    finds: Park name, address and office phone for mobile home parks and RV parks (1,407 Ohio parks).
    how: The link lists the parks in the city. The office phone usually reaches the operator. The base data is from about 2013, so check that the park still operates.
    asset_classes: [mobile_home_park, campground_rv]
    drill_stages: [property_contacts]
  ohio_mh_park_licenses:
    name: Ohio manufactured home park operator licenses
    kind: link
    cost: free
    priority: 2
    states: [OH]
    url: "https://com.ohio.gov/divisions-and-programs/manufactured-homes-program/park-operators/mh-park-operator-license"
    finds: The licensed operator's legal name, park address and approved lot count. Licenses do not transfer, so a new licensee means a recent sale.
    how: There is no public list online. Email MHProgram@com.ohio.gov (614-644-2223) for the licensed-park roster. Check one license at https://elicense.ohio.gov/oh_verifylicense.
    asset_classes: [mobile_home_park]
    drill_stages: [entity_unmask, property_contacts]
  ohio_campground_licenses:
    name: Ohio campground and RV park licenses (local health district)
    kind: link
    cost: free
    priority: 2
    states: [OH]
    url: "https://odh.ohio.gov/know-our-programs/campgrounds"
    finds: The licensed operator's name and address and the lot count for every RV park and campground. Licenses do not transfer, so a new licensee means a recent sale.
    how: Licenses are held by the county health district, not the state. Find the district on ODH's directory, then ask for the licensed-campground list. Clark County - environmental@ccchd.com, 937-390-5600.
    asset_classes: [campground_rv]
    drill_stages: [entity_unmask, property_contacts]
  indiana_mhc_roster:
    name: Indiana mobile home community roster
    kind: link
    cost: free
    priority: 1
    states: [IN]
    url: "https://secure.in.gov/health/eph/mobile-home-community-inspection-and-licensing-program/mhc-roster"
    finds: Every licensed Indiana mobile home community (5 or more homes) with licensee details.
    how: Search by county or community name.
    asset_classes: [mobile_home_park]
    drill_stages: [entity_unmask, property_contacts]
  indiana_campground_roster:
    name: Indiana RV campground roster
    kind: link
    cost: free
    priority: 1
    states: [IN]
    url: "https://secure.in.gov/health/eph/recreational-vehicle-campgrounds/campground-roster/"
    finds: Every licensed Indiana campground (10 or more sites) with operator details.
    how: Search by county.
    asset_classes: [campground_rv]
    drill_stages: [entity_unmask, property_contacts]
  ohio_self_storage_assn:
    name: Self Storage Association of Ohio member directory
    kind: link
    cost: free
    priority: 2
    url: "https://www.ohiossa.org/Membership/Member-Directory"
    finds: About 150 member companies with a contact person (often the owner), facility address and phone. Mostly independent Ohio operators.
    how: Look for the facility or owner name. Ohio has no storage license, so there is no state list.
    asset_classes: [self_storage]
    drill_stages: [property_contacts, entity_unmask]
  mhvillage_directory:
    name: MHVillage park directory
    kind: link
    cost: free
    priority: 4
    url: "https://www.mhvillage.com/parks/oh"
    finds: About 2,100 Ohio communities with lot counts and sometimes a manager or office phone.
    how: A commercial site. Browse by hand; do not scrape.
    asset_classes: [mobile_home_park]
    drill_stages: [property_contacts]
  fmcsa_carriers:
    name: FMCSA trucking company census
    kind: link
    cost: free
    priority: 3
    url: "https://data.transportation.gov/d/az4n-8mr2"
    finds: Every registered trucking company with its yard address, phone, email and up to two officer names.
    how: Filter by city or ZIP code. A carrier based at the property address is the owner or tenant of the yard.
    asset_classes: [outdoor_storage, warehouse]
    drill_stages: [property_contacts, entity_unmask]
  epa_echo:
    name: EPA ECHO facility search
    kind: link
    cost: free
    priority: 3
    url: "https://echo.epa.gov/facilities/facility-search"
    finds: Regulated businesses at an address (warehouses, trucking, scrap yards) with their permits. The facility name is usually the operator.
    how: Search by address or city. Use it to learn who occupies a warehouse or yard.
    asset_classes: [warehouse, outdoor_storage]
    drill_stages: [property_contacts]
  ohio_epa_edocs:
    name: Ohio EPA document search
    kind: link
    cost: free
    priority: 4
    states: [OH]
    url: "https://edocpub.epa.ohio.gov/publicportal/edochome.aspx"
    finds: Permits and stormwater filings that name the facility operator and a contact person.
    how: Search by company name or county.
    asset_classes: [warehouse, outdoor_storage, mobile_home_park, campground_rv]
    drill_stages: [property_contacts]
  sec_edgar:
    name: SEC EDGAR company search
    kind: link
    cost: free
    priority: 3
    url: "https://www.sec.gov/edgar/search/"
    template: "https://www.sec.gov/cgi-bin/browse-edgar?company={owner_q}&type=&dateb=&owner=include&count=40&action=getcompany"
    finds: Filings by funds and syndicators. Form D filings name the people who run the LLC.
    how: Mostly useful for larger owners that raise money from investors. Open any Form D and read 'Related Persons'.
    drill_stages: [entity_unmask, deep_research]
  ohio_ucc:
    name: Ohio UCC filing search
    kind: link
    cost: free
    priority: 4
    states: [OH]
    url: "https://ucc.ohiosos.gov/"
    finds: Lenders and related companies that filed against the owner.
    how: Search the owner name. Opens in a browser only.
    drill_stages: [entity_unmask, recorder_documents]
  ohio_real_estate_license:
    name: Ohio real estate license lookup
    kind: link
    cost: free
    priority: 3
    states: [OH]
    url: "https://elicense3.com.ohio.gov/Lookup/LicenseLookup.aspx"
    finds: Whether a property manager or broker is licensed, and their brokerage.
    how: Use after you have a manager or company name. Ohio requires a broker license to manage for others. Newer portal - https://lpi.elicense.ohio.gov/
    drill_stages: [property_contacts]
  indiana_real_estate_license:
    name: Indiana license lookup (real estate brokers)
    kind: link
    cost: free
    priority: 4
    states: [IN]
    url: "https://mylicense.in.gov/EVerification/Search.aspx"
    finds: License status and firm for Indiana brokers and managers.
    how: Search by name.
    drill_stages: [property_contacts]
  indiana_sales_disclosure:
    name: Indiana sales disclosure files (STATS Indiana)
    kind: link
    cost: free
    priority: 1
    states: [IN]
    url: "https://www.stats.indiana.edu/about/sdf.asp"
    finds: Every Indiana sale since 2008 with buyer and seller names and mailing addresses and the price.
    how: Download the yearly files in a browser. Match on the parcel number to get the buyer (the owner) and their mailing address.
    drill_stages: [records_baseline, entity_unmask, portfolio_match]
  ohio_voter_file:
    name: Ohio voter file
    kind: link
    cost: free
    priority: 3
    states: [OH]
    url: "https://www6.ohiosos.gov/ords/f?p=VOTERFTP:STWD"
    finds: Every registered voter's full name, birth year and home address. Confirms which John Smith is the owner and where to mail him.
    how: Download by hand (four files). Commercial-use rules were not checked; read the page before using it for outreach.
    drill_stages: [entity_unmask, letters]
  obituaries:
    name: Obituary search
    kind: link
    cost: free
    priority: 3
    url: "https://www.legacy.com/obituaries/search"
    template: "https://www.google.com/search?q=%22{person_q}%22+obituary+{city_q}+{state}"
    finds: Whether an owner has died, and the spouse, children and funeral home. Leads to the probate estate and the new decision-maker.
    how: If you find one, search the county probate court for the estate and its executor.
    drill_stages: [court_records, deep_research]
  bbb_profiles:
    name: Better Business Bureau profiles
    kind: link
    cost: free
    priority: 4
    template: "https://www.bbb.org/search?find_text={owner_q}&find_loc={city_q}%2C%20{state}"
    finds: Owner or president names and phone for property management and landlord companies.
    how: Open the business profile and look for 'Business Management'. The data is self-reported.
    drill_stages: [property_contacts, entity_unmask]
  courtlistener:
    name: Federal court and bankruptcy search (CourtListener)
    kind: link
    cost: free
    priority: 4
    template: "https://www.courtlistener.com/?type=r&q=%22{owner_q}%22"
    finds: Federal cases and bankruptcies that name the owner or the LLC.
    how: Free, but coverage is partial. PACER has everything at $0.10 a page (free under $30 a quarter).
    drill_stages: [court_records]
  national_dnc:
    name: National Do Not Call Registry (for callers)
    kind: link
    cost: free
    priority: 1
    url: "https://telemarketing.donotcall.gov/"
    finds: Which phone numbers are on the Do Not Call list. Check before calling or texting an owner.
    how: Register as an organization to download numbers by area code (first 5 area codes free, then $85 each a year). Indiana also has its own list ($750 a year). See docs/DATA_SOURCES.md.
    drill_stages: [property_contacts, web_footprint, paid_skip_trace]
  ohfa_compliance:
    name: Ohio Housing Finance Agency (OHFA) portfolio
    kind: link
    cost: free
    priority: 4
    states: [OH]
    url: "https://www.ohiohome.org/compliance"
    finds: Owners and management agents of OHFA-funded apartments.
    how: No public download. Ask OHFA for the portfolio list by public-records request.
    asset_classes: [apartments]
    drill_stages: [entity_unmask, property_contacts]

# County table: one entry per county, under its state. The app reads these slots:
#   auditor | rental_registration | recorder | probate | clerk | gis   (and any slot a source names
#   with county_slot: delinquent_tax | sheriff_sale). A slot is {url, template?, name?, how?}.
#   `url` is the search page. `template` is a deep link built from the property's APN; it is only
#   given when it was checked. template_status: tested = a parcel page loaded with the right owner;
#   county_published = the county's own map or data uses this exact link, but the site blocks
#   scripts so it was not loaded here; none = no parcel link, use the search page.
#   rental_registration also says available (true/false/null = unknown) and includes_phone.
#   city_rental, code_enforcement, bulk_data, fips and note are reference notes for people.
# Every URL was checked on 2026-10-21. Sites behind Cloudflare or Azure firewalls work in a normal
# browser but not from scripts; never scrape them (several robots.txt files forbid it).
counties:
  OH:
    CLARK:
      fips: '39023'
      auditor:
        url: "https://clarkcountyauditor.org/Search"
        template: "https://clarkcountyauditor.org/Parcel?Parcel={apn_digits}"
        template_status: tested
        how: Opens the parcel page. The parcel number is 16 digits with no dashes (e.g. 3400700028404020); the link strips the dashes for you. The site shows a 'checking your browser' screen first, then loads. To search by owner name, use the Search page.
        note: 'Pivot Point site behind Cloudflare (403 to every script). The 16-digit key was confirmed 2026-10-21 through Pivot Point''s record-card PDF for parcel 3400700028404020 (owner CITY OF SPRINGFIELD OHIO THE, 0 BURT ST). robots.txt bans automated collection: links are for a person only.'
      rental_registration:
        name: City of Springfield rental registry (no public search)
        url: "https://springfieldohio.gov/city_services/rental-property-registration/"
        available: false
        includes_phone: null
        how: 'No county registry: Clark (about 136,000 people) is under the 200,000-person line in ORC 5323. The City of Springfield runs its own registry ($35 a single-unit property, $25 a unit in multi-unit buildings, $750 cap per owner). There is no public search. Ask the city for the owner and contact on file with a public-records request. Questions: 937-324-7385.'
      recorder:
        url: "https://clark.oh.publicsearch.us/"
        how: 'Free name and document search (GovOS PublicSearch). The older CountyFusion site still works: https://countyfusion14.govos.com/countyweb/loginDisplay.action?countyname=ClarkOH'
      probate:
        url: "https://probate.clarkcountyohio.gov/recordSearch.php"
        how: Accept the disclaimer, then search estates by name. New filings appear after about a day.
      clerk:
        url: "https://eservices.clarkcountyohiocourt.com/eservices/home.page"
        how: Common Pleas civil and foreclosure cases. Evictions are in Clark County Municipal Court (https://clarkcountymunicipalcourt.gov/, opens in a browser only; its case search was not checked).
      gis:
        url: "https://clarkcountyauditor.org/Map"
