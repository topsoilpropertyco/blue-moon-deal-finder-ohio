[project]
name = "bluemoon"
version = "1.0.0"
description = "Blue Moon Deal Finder: rank properties, run the DRILL, reach every owner."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv]
package = false
