# Blue Moon Deal Finder settings.
# Thresholds, weights, origin and rent settings live here, never in code.
# Asset-class buy boxes and score weights: config/asset_classes.yaml
# DRILL stages: config/drill.yaml
# Free data sources and county links: config/sources.yaml

app:
  name: Blue Moon Deal Finder
  host: 127.0.0.1        # use 0.0.0.0 to reach it from your phone over Tailscale (needs APP_PASSWORD in .env)
  port: 8765
  login_max_failures: 5          # wrong passwords from one device before it has to wait
  login_lock_max_minutes: 15     # the longest wait (it doubles from 1 minute with each further wrong password)
  # Other names the dashboard may be opened under. Raw IP addresses, localhost, this Mac's own name
  # (and name.local) and Tailscale names (*.ts.net) always work; anything else is refused, so a web page
  # can't reach the dashboard through a look-alike name (DNS rebinding).
  # allowed_hosts: [mac-mini.example.lan]

# Dashboard settings (all optional; these are the defaults).
web:
  moon_score: 0.10               # Blue Moon score for the "Blue Moon 10%+" view and count
  funnel_score: 0.05             # Blue Moon score for the last step of the "Find the property" funnel
  long_owned_years: 15           # "Owned a long time" view: owned at least this many years
  mom_owner_types: [individual, trust, estate, small_llc]   # the "Mom and pop" view
  page_size: 100                 # rows per page in the deals list
  max_page_size: 500
  upload_max_mb: 50              # biggest Crexi file the Import screen accepts
  rescore_delay_seconds: 3       # re-score this long after the last photo answer or deal outcome
  drive_close_call_minutes: 15   # Deals: set aside only for an estimated drive this close to the limit = "close call"

paths:
  db: data/bluemoon.sqlite
  crexi_dir: data/crexi
  hud_dir: data/hud
  images: images
  labels: labels
  output: output

# A market is one portal in the app: an asset class + a geography.
# Every market gets the same screens. Add more markets here.
markets:
  - slug: apartments-springfield-oh
    asset_class: apartments
    geography: Springfield, OH
    origin: {label: "Downtown Springfield, OH", lat: 39.9242, lng: -83.8088}
    max_drive_minutes: 60
  - slug: self-storage-springfield-oh
    asset_class: self_storage
    geography: Springfield, OH
    origin: {label: "Downtown Springfield, OH", lat: 39.9242, lng: -83.8088}
    max_drive_minutes: 60
  - slug: warehouses-springfield-oh
    asset_class: warehouse
    geography: Springfield, OH
    origin: {label: "Downtown Springfield, OH", lat: 39.9242, lng: -83.8088}
    max_drive_minutes: 60
  - slug: rv-parks-springfield-oh
    asset_class: campground_rv
    geography: Springfield, OH
    origin: {label: "Downtown Springfield, OH", lat: 39.9242, lng: -83.8088}
    max_drive_minutes: 60
  - slug: mobile-home-parks-springfield-oh
    asset_class: mobile_home_park
    geography: Springfield, OH
    origin: {label: "Downtown Springfield, OH", lat: 39.9242, lng: -83.8088}
    max_drive_minutes: 60
  - slug: outdoor-storage-springfield-oh
    asset_class: outdoor_storage
    geography: Springfield, OH
    origin: {label: "Downtown Springfield, OH", lat: 39.9242, lng: -83.8088}
    max_drive_minutes: 60
  - slug: land-springfield-oh
    asset_class: raw_land
    geography: Springfield, OH
    origin: {label: "Downtown Springfield, OH", lat: 39.9242, lng: -83.8088}
    max_drive_minutes: 60

crexi:
  credits_per_month: 500          # owner-contact credits per credit period; they do not roll over
  reset_day: 29                   # a new credit period starts on this day of every month (29: Oct 29 to Nov 28, then Nov 29...)
  # When the possible owners in the buy box (all markets together) can't use every credit, the rest go to
  # these, in this order, so none expire. Seth: please confirm the order. [] turns this off.
  #   level1_buybox = buy-box owners with no owner name yet (a credit may show it)
  #   set_aside     = the best owners just outside the buy box (fewest reasons first, then score)
  plan_fallbacks: [level1_buybox, set_aside]
  # Owners set aside for these reasons never get a fallback credit.
  plan_hard_exclusions: [state, skip_county, property_type]
  # Force a column mapping when auto-mapping guesses wrong.
  # Key = our field name, value = exact Crexi column header.
  column_overrides: {}
  fuzzy_min_score: 88            # 0-100; how close a column name must be to auto-match
  units_from_addresses_min: 2    # use 'Number of Addresses' as the unit count only when it is at least this

# Counties the drive-time filter should never keep, whatever the minutes.
geography:
  skip_counties:
    OH: [CLERMONT, FAIRFIELD, LICKING, MERCER, MORROW]
    IN: [FAYETTE, FRANKLIN, HENRY, JAY, DEARBORN]
  allowed_states: [OH, IN]

# How the Deals "Why?" panel groups the properties that are set aside, so you can look at one group at a time
# and add a whole group to the buy box (or keep it set aside). Size groups: config/asset_classes.yaml.
set_aside:
  drive_minutes: [75, 90, 120]   # drive groups over the market's limit: 61-75, 76-90, 91-120 and over 120 min
  year_step: 10                  # year-built groups below the buy box's first year: one per decade...
  year_steps: 3                  # ...for this many decades (1960s, 1950s, 1940s), then one group back to...
  year_oldest: 1900              # ...this year (1900-1939), and one group for anything older

drive:
  provider: google_routes        # google_routes | estimate
  # Used when there is no Google key, and for the free dry run.
  # Road miles ~ straight-line miles x road_factor; minutes at avg_mph.
  estimate: {road_factor: 1.25, avg_mph: 48}
  batch_size: 25                 # destinations per Routes API request
  routing_preference: TRAFFIC_UNAWARE   # cheapest Google tier (Essentials)
  google_max_estimate_ratio: 2.0 # skip Google when the free estimate is over 2x the market's max minutes
  timeout_seconds: 60
  max_retries: 4
  max_elements_per_run: 10000    # hard cap: Google drive times asked per run; the rest wait for the next run

geocode:
  # Only for properties without map coordinates. Free US Census geocoder first; Google only if it fails.
  benchmark: Public_AR_Current
  census_batch_size: 1000        # Census allows up to 10,000 per batch
  max_retries: 3

google:
  concurrency: 5
  street_view: {fov: 80, pitch: 5, size: 640x640, side_offsets_deg: [-35, 35], radius_m: 50, source: outdoor}
  satellite: {zoom: 19, size: 640x640, maptype: satellite, marker: true}
  timeout_seconds: 30
  max_retries: 3
  # Hard caps per run. A run stops when it hits one.
  max_street_view_images_per_run: 3000
  max_satellite_images_per_run: 1000
  # USD per 1,000 calls after the monthly free calls, and free calls per month.
  # Check https://mapsplatform.google.com/pricing/ ; edit if Google changes them.
  prices:
    geocoding: {per_1000: 5.00, free_per_month: 10000}
    route_matrix_element: {per_1000: 5.00, free_per_month: 10000}
    street_view_static: {per_1000: 7.00, free_per_month: 10000}
    street_view_metadata: {per_1000: 0.00, free_per_month: 0}
    static_maps: {per_1000: 2.00, free_per_month: 10000}

vision:
  # claude_cli  = your Claude plan via Claude Code on the Mac Mini (no per-call bill)
  # anthropic_api = pay-per-use API (needs ANTHROPIC_API_KEY)
  # mock = offline test mode
  backend: claude_cli
  claude_cli:
    command: claude
    model: sonnet
    timeout_seconds: 240
    pause_seconds: 2             # gap between calls, to be gentle on plan limits
    json_schema: true            # ask Claude Code for validated JSON
    rate_limit_wait_seconds: 60
  anthropic_api:
    model: claude-sonnet-5-5
    max_tokens: 800
    est_cost_per_call_usd: 0.03
  max_calls_per_run: 400
  examples_per_call: 6           # labeled examples from your reviews sent with each call
  weight_vision: 0.8             # final = 80% photo verdict, 20% rules prior
  images_per_example: 2          # photos sent per labeled example
  max_consecutive_errors: 3      # stop a run after this many errors in a row

review:
  default_scope: everything      # everything = the AI's unsure ones first, then every call it made | unsure = unsure only
  learning_window: 50            # Scorecard "learning over time": your latest this-many reviews vs the earlier ones
  spot_check_fraction: 0         # 'Unsure only' list: also show this share (0.05 = 5%) of the AI's confident calls as random spot checks
  acceptance_min: 0.90           # green must be >= 90% truly target; red >= 90% truly not
  acceptance_min_reviews: 10     # reviews needed before pass/fail is shown
  include_unchecked: false       # true = also list photos the AI hasn't looked at yet (normally the AI looks first)

rent:
  # hud_arcgis = HUD's free public map service (no key)
  # hud_file   = a HUD FMR spreadsheet you downloaded into data/hud/
  # hud_api    = HUD USER API (needs HUD_API_TOKEN)
  source: hud_arcgis
  hud_arcgis_url: https://services.arcgis.com/VTyQ9soqVukalItT/arcgis/rest/services/Fair_Market_Rents/FeatureServer/0/query
  hud_safmr_url: https://services.arcgis.com/VTyQ9soqVukalItT/arcgis/rest/services/HUD_PDR_Small_Area_Fair_Market_Rents/FeatureServer
  prefer_small_area: true        # use ZIP-level Small Area FMRs where HUD has them
  concurrency: 3                 # be polite to HUD
  after_import: true             # run the free HUD rent check in the background after a dashboard import

safety:
  confirm_over_properties: 50    # paid runs bigger than this need an explicit OK
  confirm_clears_over: 10        # a Blue Moon file whose empty cells would erase more values than this asks first

scoring:
  base_rate: 0.015               # Blue Moon odds before any evidence
  learn_prior_strength: 30       # pseudo-observations behind each starting weight
  worn_improvement_ratio: 0.35   # building value under 35% of total = "worn"
  visual_green_min: 80
  visual_red_max: 20
  estimate_weight: 0.5           # estimated sizes count half as much in the score
  positive_outcomes: [blue_moon, bought]

owners:
  portfolio_min_properties: 5    # an owner with this many separate sites is a "portfolio" owner
  institutional_min_properties: 40
  same_site_meters: 200          # parcels this close count as one site
  mailing_group_max_names: 50    # a mailing address used by more names than this is a tax service, not an owner
  free_and_clear_min_years: 10   # no loan on record and owned this long = likely free and clear
  maturing_soon_months: 18
  portfolio_exempt_types: [institutional, government]
  institutional_names: []        # extra big-operator names
  overrides: {}                  # "EXACT OWNER NAME": owner_type  (fix a wrong guess)

share:
  provider: cloudflare           # cloudflare = a new temporary link each time | ngrok = your free permanent address
  ngrok_domain: ""               # for ngrok: the free address from dashboard.ngrok.com > Domains, e.g. something.ngrok-free.app
